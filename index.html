<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <title>TG INDEX Parallel</title>
  <link rel="icon" href="/tg-index-header-transparent.webp">
  <script type="module" crossorigin src="/assets/index-BTrIwEEt.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CSvwHqk8.css">
</head>
<body>
  <div id="auth-gate" class="auth-gate" hidden>
    <div class="auth-panel" role="dialog" aria-labelledby="auth-title">
      <span class="eyebrow">PRIVATE ACCESS</span>
      <h1 id="auth-title">TG INDEX 로그인</h1>
      <p id="auth-message">승인된 Google 계정으로 로그인해주세요.</p>
      <button id="google-sign-in" class="auth-button" type="button">Google로 계속</button>
    </div>
  </div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <img src="/tg-index-header-transparent.webp" class="brand" alt="TG INDEX Market Intelligence">
      <div class="build-badge">PARALLEL TEST</div>
    </header>

    <nav class="tabs" aria-label="지표 탭">
      <button class="tab active" data-page="market">시황</button>
      <button class="tab" data-page="inflation">물가·금리</button>
    </nav>

    <main>
      <section id="page-market" class="page active" aria-labelledby="market-title">
        <div class="section-head">
          <div><span class="eyebrow">MARKET BRIEF</span><h1 id="market-title">오늘의 시황</h1></div>
          <span id="market-updated" class="date-badge">불러오는 중</span>
        </div>
        <div id="market-status" class="status-line" role="status">데이터를 불러오고 있습니다.</div>
        <div class="market-grid">
          <article class="panel memo-panel">
            <div class="panel-label">시황 코멘트</div>
            <p id="market-comment" class="memo-text skeleton-line">&nbsp;</p>
          </article>
          <article class="panel">
            <div class="panel-label">매수 가능</div>
            <div id="buy-list" class="stock-list skeleton-line">&nbsp;</div>
          </article>
          <article class="panel">
            <div class="panel-label">매도 종목</div>
            <div id="sold-list" class="stock-list skeleton-line">&nbsp;</div>
          </article>
        </div>
      </section>

      <section id="page-inflation" class="page" aria-labelledby="inflation-title">
        <div class="section-head">
          <div><span class="eyebrow">INFLATION &amp; RATES</span><h1 id="inflation-title">물가·금리</h1></div>
          <span id="inflation-updated" class="date-badge">불러오는 중</span>
        </div>
        <div id="inflation-status" class="status-line" role="status">데이터를 불러오고 있습니다.</div>
        <div class="chart-grid">
          <article class="chart-panel">
            <div class="chart-title"><div><h2>물가 지표</h2><p>전년동월대비 · %</p></div></div>
            <div class="canvas-wrap"><canvas id="inflation-chart"></canvas></div>
          </article>
          <article class="chart-panel">
            <div class="chart-title"><div><h2>미국 금리 분해</h2><p>10년물 · %</p></div></div>
            <div class="canvas-wrap"><canvas id="rates-chart"></canvas></div>
          </article>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
