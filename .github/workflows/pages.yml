name: Deploy TG INDEX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..8}; do
            if id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                --jq 'first(.artifacts[] | select(.expired == false) | .id) | . // empty') && [[ -n "$id" ]]; then
              echo "Pages artifact $id is available"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Uploaded github-pages artifact did not become available"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
